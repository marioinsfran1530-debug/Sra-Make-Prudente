name: Patch product draft persistence

on:
  push:
    branches:
      - fix/pwa-product-draft-resume

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/patch-product-draft.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/components/admin/ProductForm.tsx; then
            echo "ProductForm already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/ProductForm.tsx
          git commit -m "fix: recuperar rascunho do cadastro de produto"
          git push origin HEAD:${{ github.ref_name }}
