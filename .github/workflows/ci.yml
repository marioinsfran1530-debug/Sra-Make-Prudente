name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade do código
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Gerar package-lock temporariamente
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/version-package-lock'
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: versionar package-lock.json"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Testar regras críticas
        run: npm test

      - name: Verificar lint
        run: npm run lint
