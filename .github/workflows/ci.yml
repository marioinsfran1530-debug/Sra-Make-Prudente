name: CI

on:
  push:
    branches: [develop, master, "fix/**", "feat/**", "chore/**"]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade do código
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Testar regras críticas
        run: npm test

      - name: Diagnóstico do lint (temporário)
        continue-on-error: true
        run: |
          npx eslint . --format json --output-file "$RUNNER_TEMP/eslint.json" || true
          node - "$RUNNER_TEMP/eslint.json" <<'EOF'
          const report = require(process.argv[2]);
          const esc = (s) => s.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
          const errors = [];
          for (const file of report) {
            for (const m of file.messages) {
              if (m.severity === 2) {
                errors.push(`${file.filePath.replace(process.cwd() + "/", "")}:${m.line} [${m.ruleId}] ${m.message}`);
              }
            }
          }
          console.log(`::error title=ESLINT-ERROS (${errors.length})::${esc(errors.join("\n") || "nenhum erro").slice(0, 60000)}`);
          EOF

      - name: Verificar lint
        run: npm run lint
